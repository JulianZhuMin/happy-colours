<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Colors 快樂認識顏色</title>
<meta name="description" content="快樂認識顏色 Happy Colors：俾兩至四歲小朋友玩嘅廣東話認顏色遊戲。A Cantonese color game for toddlers.">
<meta name="theme-color" content="#FFF6E5">
<meta name="app-version" content="4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="快樂認識顏色">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { --spd: 1; --bg: #FFF6E5; --ink: #3b2f2a; --accent: #e0561b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Noto Sans HK", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
    -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .screen[hidden] { display: none !important; }
  :focus-visible { outline: 4px solid #1565c0; outline-offset: 4px; border-radius: 16px; }

  /* ---------- parent screens ---------- */
  .parent { gap: min(2.4vh, 18px); text-align: center; background:
      radial-gradient(circle at 15% 20%, #ffe3c2 0 12%, transparent 13%),
      radial-gradient(circle at 88% 78%, #d9f0ff 0 14%, transparent 15%), var(--bg); }
  .parent h1, .parent h2 { margin: 0; font-size: clamp(26px, 9vh, 52px); letter-spacing: .06em; }
  .app-name .zh, .app-name .en { display: block; }
  .app-name .en { font-size: .42em; letter-spacing: .04em; font-weight: 700; color: #6a5a50; margin-top: .1em; }
  .parent h1 .dot { display: inline-block; width: .5em; height: .5em; border-radius: 50%; margin: 0 .04em; vertical-align: .12em; }
  .parent .sub { margin: 0; font-size: clamp(15px, 4.4vh, 24px); }
  .mini { display: flex; gap: min(1.6vw, 12px); align-items: flex-end; height: clamp(44px, 15vh, 96px); }
  .mini svg { height: 100%; width: auto; overflow: visible; }
  .big-btn { min-width: min(62vw, 440px); min-height: 72px; padding: min(2.6vh, 18px) 36px; border: 0; border-radius: 999px;
    font-size: clamp(28px, 10vh, 54px); font-weight: 800; letter-spacing: .2em; color: #fff; background: var(--accent);
    box-shadow: 0 8px 0 #a83d0e, 0 12px 24px rgba(0,0,0,.18); cursor: pointer; }
  .big-btn:active { transform: translateY(5px); box-shadow: 0 3px 0 #a83d0e; }
  .btn-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .mid-btn { min-height: 64px; min-width: 150px; padding: 10px 26px; border-radius: 999px; border: 4px solid #3b2f2a22; background: #fff;
    font-size: clamp(20px, 6.5vh, 32px); font-weight: 700; cursor: pointer; box-shadow: 0 6px 0 #00000022; }
  .mid-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #00000022; }
  #again-btn { position: absolute; z-index: 5; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right));
    min-height: 48px; padding: 0 16px 0 12px; border-radius: 24px; overflow: hidden; border: 2px solid rgba(255,255,255,.8);
    background: #b84410; color: #fff; font-size: 17px; font-weight: 800; line-height: 1.1; cursor: pointer;
    display: flex; align-items: center; gap: 6px; touch-action: none; -webkit-touch-callout: none; }
  #again-btn::after { content: ""; position: absolute; left: 0; bottom: 0; height: 5px; width: calc(var(--p, 0) * 100%); background: #fff; }
  .overlay { position: absolute; inset: 0; z-index: 10; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center;
    padding: 20px; touch-action: none; }
  .overlay[hidden] { display: none; }
  .overlay .panel { background: #fff; border-radius: 22px; padding: 20px 22px 18px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  .overlay h2 { margin: 0 0 4px; font-size: 24px; letter-spacing: 0; }
  .overlay p { margin: 0 0 16px; font-size: 18px; }
  .overlay .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .overlay button { font-size: 18px; font-weight: 800; border: 0; border-radius: 14px; padding: 12px 18px; min-height: 52px; cursor: pointer; touch-action: manipulation; }
  #again-yes { background: #b84410; color: #fff; }
  #again-no { background: #e9ecef; color: #1d1d1f; }
  .note { margin: 0; max-width: 46em; padding: 0 16px; font-size: clamp(12px, 3.4vh, 16px); line-height: 1.45; color: #6a5a50; }

  /* ---------- game ---------- */
  #game { background: linear-gradient(#FFF6E5 0 66%, #F6E4C3 66% 100%); justify-content: center; }
  #caption { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    min-height: 1.4em; padding: .1em .7em; border-radius: 999px; background: #fff; border: 3px solid #0000000f;
    font-size: clamp(22px, 9vh, 56px); font-weight: 800; white-space: nowrap; opacity: 0; transition: opacity calc(.25s / var(--spd)); }
  #caption.show { opacity: 1; }
  #caption .sw { display: inline-block; width: .7em; height: .7em; border-radius: 50%; margin-right: .3em; vertical-align: -.05em; border: 3px solid #0000002e; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-top: 6vh; }
  #row { --gap: clamp(4px, 1.2vw, 18px);
    --w: min(calc((100vw - env(safe-area-inset-left) - env(safe-area-inset-right) - 24px - 6 * var(--gap)) / 7), 52vh);
    display: flex; flex-wrap: nowrap; gap: var(--gap); align-items: flex-end; justify-content: center; }
  .char { position: relative; display: block; width: var(--w); height: calc(var(--w) * 0.943); padding: 0; margin: 0; border: 0; background: none;
    cursor: pointer; border-radius: 24px; }
  #row { transition: opacity calc(.25s / var(--spd)) ease; }
  #row.fading { opacity: 0; }
  .char .scaler, .char .jumper { display: block; width: 100%; height: 100%; transform-origin: 50% 92%; }
  .char .scaler { transform: scale(.94); transition: transform calc(.35s / var(--spd)) cubic-bezier(.3,1.6,.5,1); }
  #stage.open .char .scaler { transform: scale(1.1); }
  #stage.open .char .jumper { filter: drop-shadow(0 6px 6px rgba(0,0,0,.18)); }
  .char svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .arm { transform-box: view-box; transition: transform calc(.3s / var(--spd)) ease-out; }
  .arm-l { transform-origin: 34px 128px; transform: rotate(-28deg); }
  .arm-r { transform-origin: 166px 128px; transform: rotate(28deg); }
  .char.hand-up .arm-r { transform: rotate(-52deg); }
  .char.waving .arm-l { animation: waveL calc(.42s / var(--spd)) ease-in-out infinite alternate; }
  .char.waving .arm-r { animation: waveR calc(.42s / var(--spd)) ease-in-out infinite alternate; }
  @keyframes waveL { from { transform: rotate(40deg); } to { transform: rotate(80deg); } }
  @keyframes waveR { from { transform: rotate(-40deg); } to { transform: rotate(-80deg); } }

  /* intro: one big character in the centre */
  #stage.intro .char { position: absolute; --w: min(62vh, 44vw); left: calc(50% - var(--w) / 2); top: calc(53% - var(--w) * 0.47); }
  #stage.intro .char:not(.here) { visibility: hidden; }
  .char.enter { animation: enter calc(.65s / var(--spd)) cubic-bezier(.2,.9,.3,1.2) both; }
  .char.leave { animation: leave calc(.55s / var(--spd)) ease-in both; }
  @keyframes enter { from { transform: translateX(60vw) scale(.5) rotate(12deg); opacity: 0; } 75% { transform: translateX(-3vw) scale(1.04); opacity: 1; } to { transform: none; opacity: 1; } }
  @keyframes leave { to { transform: translateX(-60vw) scale(.5) rotate(-12deg); opacity: 0; } }
  .char.pop-in { animation: popin calc(.5s / var(--spd)) cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes popin { from { transform: scale(0); opacity: 0; } to { transform: none; opacity: 1; } }
  .jumper.bounce { animation: bounce calc(.6s / var(--spd)) ease-in-out 2; }
  .jumper.jump { animation: jump calc(.8s / var(--spd)) ease-out 1; }
  .jumper.wiggle { animation: wiggle calc(.6s / var(--spd)) ease-in-out 1; }
  @keyframes bounce { 0%,100% { transform: none; } 30% { transform: translateY(-10%) scale(.97,1.04); } 60% { transform: translateY(0) scale(1.05,.95); } }
  @keyframes jump { 0% { transform: none; } 15% { transform: scale(1.1,.86); } 45% { transform: translateY(-38%) scale(.94,1.08); }
    72% { transform: translateY(0) scale(1.08,.9); } 86% { transform: translateY(-7%); } 100% { transform: none; } }
  @keyframes wiggle { 0%,100% { transform: none; } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
  /* wrong tap: gentle "not quite" head-shake with a soft dim (~0.6 s) */
  .jumper.nope { animation: nope calc(.6s / var(--spd)) ease-in-out 1; }
  @keyframes nope { 0%,100% { transform: none; filter: none; } 15% { transform: translateX(-5%) rotate(-5deg); filter: brightness(.9) saturate(.85); }
    35% { transform: translateX(4%) rotate(4deg); } 55% { transform: translateX(-3%) rotate(-3deg); filter: brightness(.9) saturate(.85); }
    75% { transform: translateX(2%) rotate(1.5deg); } }
  .jumper.glow { filter: drop-shadow(0 0 10px #ffb300) drop-shadow(0 0 4px #ffb300); }

  /* rotate hint (portrait) */
  #rotate { display: none; position: fixed; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 5;
    align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px; background: #fff; border: 3px solid #ff7a3d55;
    font-size: 18px; font-weight: 700; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
  #rotate svg { width: 34px; height: 34px; animation: tilt 2.4s ease-in-out infinite; }
  @keyframes tilt { 0%,30% { transform: rotate(0); } 60%,100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) {
    #rotate { display: flex; }
    #row { flex-wrap: wrap; max-width: 96vw; --w: min(23vw, 20vh); row-gap: 4vh; }
    #stage.intro .char { --w: min(74vw, 44vh); }
    .mini { height: clamp(40px, 8vh, 80px); }
    .big-btn { min-width: 70vw; font-size: clamp(28px, 6vh, 54px); }
    .parent h1, .parent h2 { font-size: clamp(26px, 6vh, 52px); }
    .parent { padding-bottom: 70px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .char.enter { animation: fade calc(.4s / var(--spd)) ease both; }
    .char.leave { animation: fade calc(.4s / var(--spd)) ease reverse both; }
    .char.pop-in { animation: fade calc(.3s / var(--spd)) ease both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .jumper.nope { animation: nopeFade calc(.6s / var(--spd)) ease-in-out 1; }   /* no shake: soft fade instead */
    @keyframes nopeFade { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
    .jumper.bounce, .jumper.jump, .jumper.wiggle { animation: none; filter: drop-shadow(0 0 10px #ffb300) drop-shadow(0 0 4px #ffb300); }
    .char .scaler, .arm, #caption { transition: none; }
    .char.waving .arm-l { animation: none; transform: rotate(60deg); }
    .char.waving .arm-r { animation: none; transform: rotate(-60deg); }
    #rotate svg { animation: none; transform: rotate(-90deg); }
    .big-btn:active, .mid-btn:active { transform: none; }
  }
</style>
</head>
<body>
  <!-- Polite live region, used sparingly: only for spoken words when this device has neither clips nor speech synthesis. -->
  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <section id="start" class="screen parent" aria-labelledby="title">
    <h1 id="title" class="app-name"><span class="zh">快樂認識顏色</span><span class="en" lang="en">Happy Colors</span></h1>
    <p class="sub">同小朋友一齊認顏色</p>
    <div class="mini" id="startMini" aria-hidden="true"></div>
    <button id="startBtn" class="big-btn" type="button" aria-label="開始玩">開始</button>
    <p class="note" id="voiceNote"></p>
    <p class="note">七個顏色公仔會逐個出嚟講自己係咩顏色，跟住聽住個顏色，㩒啱嗰個公仔！</p>
  </section>

  <main id="game" class="screen" hidden aria-labelledby="gameTitle">
    <h2 id="gameTitle" class="sr-only" tabindex="-1">遊戲進行中</h2>
    <div id="caption" aria-hidden="true"></div>
    <div id="stage" class="closed"><div id="row"></div></div>
  </main>

  <section id="again" class="screen parent" hidden aria-labelledby="againTitle">
    <h2 id="againTitle" tabindex="-1">玩完喇！</h2>
    <div class="mini" id="endMini" aria-hidden="true"></div>
    <div class="btn-row">
      <button id="doneBtn" class="mid-btn" type="button" aria-label="完，唔玩喇">完</button>
    </div>
    <!-- Parent control (same pattern as Say & Go): tap / VoiceOver double-tap -> confirm dialog; press and hold 1.5 s -> restart directly -->
    <button type="button" id="again-btn" aria-describedby="again-help">
      <span aria-hidden="true">↻</span><span>再玩過</span>
    </button>
    <p id="again-help" class="sr-only">家長用：會先問你確認先再玩。睇得見嘅家長亦可以㩒住一秒半直接再玩。</p>
    <div id="again-confirm" class="overlay" hidden>
      <div class="panel" role="alertdialog" aria-modal="true" aria-labelledby="again-title" aria-describedby="again-desc">
        <h2 id="again-title">再玩過？</h2>
        <p id="again-desc">重新開始，返去介紹顏色</p>
        <div class="row">
          <button type="button" id="again-yes">好，再玩過</button>
          <button type="button" id="again-no">唔使</button>
        </div>
      </div>
    </div>
  </section>

  <div id="rotate" role="note">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="12" y="4" width="16" height="30" rx="4" fill="#fff" stroke="#3b2f2a" stroke-width="3"/><circle cx="20" cy="29" r="1.8" fill="#3b2f2a"/></svg>
    <span>打橫部機，會更好玩！</span>
  </div>

<script>
(function () {
  'use strict';
  var APP_NAME = { zh: '快樂認識顏色', en: 'Happy Colors' };   // also in <title>, apple-mobile-web-app-title, manifest.json, README
  var APP_VERSION = '4';   // bump together with CACHE in sw.js
  var params = new URLSearchParams(location.search);
  var SPEED = Math.max(0.25, Math.min(20, parseFloat(params.get('speed')) || 1));   // test hook: ?speed=4 makes everything faster
  document.documentElement.style.setProperty('--spd', SPEED);

  var COLORS = [
    { id: 'red',    zh: '紅色', body: '#E53935', line: '#8E1B18', snd: 'boing',  f: 330 },
    { id: 'yellow', zh: '黃色', body: '#FDD835', line: '#A07C00', snd: 'squeak', f: 680 },
    { id: 'blue',   zh: '藍色', body: '#1E88E5', line: '#0B3F86', snd: 'boing',  f: 220 },
    { id: 'green',  zh: '綠色', body: '#43A047', line: '#1B5E20', snd: 'pop',    f: 480 },
    { id: 'grey',   zh: '灰色', body: '#9E9E9E', line: '#4f4f4f', snd: 'squeak', f: 520 },
    { id: 'black',  zh: '黑色', body: '#222222', line: '#000000', snd: 'boing',  f: 150, dark: true },
    { id: 'white',  zh: '白色', body: '#FFFFFF', line: '#5d6875', snd: 'pop',    f: 780 }
  ];
  var byId = {}; COLORS.forEach(function (c) { byId[c.id] = c; });

  /* ---------- test/debug log ---------- */
  var T = window.__cg = { log: [], scene: 'start', speed: SPEED, voice: null, reduceMotion: false, version: APP_VERSION };
  function log(o) { o.at = Math.round(performance.now()); T.log.push(o); }
  var reduceMQ = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  T.reduceMotion = reduceMQ.matches;

  /* ---------- character drawing ---------- */
  function charSVG(c) {
    var b = c.body, l = c.line, sw = 'stroke="' + l + '" stroke-width="5" stroke-linejoin="round"';
    var faceLine = c.dark ? '#ffffff' : '#2b2b2b';
    return '<svg viewBox="-22 0 244 230" aria-hidden="true" focusable="false">' +
      '<g class="arm arm-l"><ellipse cx="6" cy="128" rx="30" ry="13" fill="' + b + '" ' + sw + '/></g>' +
      '<g class="arm arm-r"><ellipse cx="194" cy="128" rx="30" ry="13" fill="' + b + '" ' + sw + '/></g>' +
      '<ellipse cx="74" cy="206" rx="22" ry="13" fill="' + b + '" ' + sw + '/>' +
      '<ellipse cx="126" cy="206" rx="22" ry="13" fill="' + b + '" ' + sw + '/>' +
      '<path d="M100 32 C146 32 170 66 170 118 C170 172 140 204 100 204 C60 204 30 172 30 118 C30 66 54 32 100 32 Z" fill="' + b + '" ' + sw + '/>' +
      '<ellipse cx="74" cy="64" rx="18" ry="10" transform="rotate(-25 74 64)" fill="#fff" opacity="' + (c.id === 'white' ? 0 : .32) + '"/>' +
      '<ellipse cx="76" cy="106" rx="15" ry="18" fill="#fff" stroke="#2b2b2b" stroke-width="2.5"/>' +
      '<ellipse cx="124" cy="106" rx="15" ry="18" fill="#fff" stroke="#2b2b2b" stroke-width="2.5"/>' +
      '<circle cx="78" cy="110" r="8.5" fill="#1d1d1d"/><circle cx="126" cy="110" r="8.5" fill="#1d1d1d"/>' +
      '<circle cx="81" cy="106" r="3" fill="#fff"/><circle cx="129" cy="106" r="3" fill="#fff"/>' +
      '<ellipse cx="56" cy="140" rx="11" ry="7" fill="#ff6f9a" opacity=".55"/><ellipse cx="144" cy="140" rx="11" ry="7" fill="#ff6f9a" opacity=".55"/>' +
      '<path d="M78 138 Q100 170 122 138 Q100 146 78 138 Z" fill="#6d1b1b" stroke="' + faceLine + '" stroke-width="' + (c.dark ? 3.5 : 3) + '" stroke-linejoin="round"/>' +
      '<path d="M90 152 Q100 160 110 152 Q100 148 90 152 Z" fill="#ff7d8a"/>' +
      '</svg>';
  }

  var row = document.getElementById('row'), stage = document.getElementById('stage');
  var els = {};
  COLORS.forEach(function (c) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'char'; b.dataset.color = c.id;
    b.setAttribute('aria-label', c.zh + '公仔');
    b.setAttribute('aria-disabled', 'true');
    b.innerHTML = '<span class="scaler"><span class="jumper">' + charSVG(c) + '</span></span>';
    b.addEventListener('click', function (e) { e.preventDefault(); onCharTap(c); });
    row.appendChild(b); els[c.id] = b;
  });
  ['startMini', 'endMini'].forEach(function (id) {
    document.getElementById(id).innerHTML = COLORS.map(charSVG).join('');
  });

  /* ---------- audio (Web Audio, all synthesised) ---------- */
  var ctx = null, master = null, voiceBus = null;
  function ensureAudio() {
    try {
      if (!ctx) {
        var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
        ctx = new AC();
        var comp = ctx.createDynamicsCompressor(); comp.connect(ctx.destination);
        master = ctx.createGain(); master.gain.value = 0.55; master.connect(comp);
        voiceBus = ctx.createGain(); voiceBus.gain.value = 1; voiceBus.connect(ctx.destination);   // clips are pre-normalised
        CLIP_NAMES.forEach(decodeClip);
      }
      if (ctx.state !== 'running') ctx.resume();
      return true;
    } catch (e) { return false; }
  }
  function unlockAudio() {
    // iOS 17+: play through the silent switch like a media app (Web Audio is otherwise muted by it)
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* ignore */ }
    if (!ensureAudio()) return;
    try { var buf = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource(); s.buffer = buf; s.connect(ctx.destination); s.start(0); } catch (e) { /* ignore */ }
  }
  function tone(type, t0, dur, f0, f1, vol, vib) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur * 0.6);
    if (vib) { var l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = vib.rate; lg.gain.value = vib.depth; l.connect(lg); lg.connect(o.frequency); l.start(t0); l.stop(t0 + dur); }
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function playSound(kind, c) {
    log({ t: 'sound', kind: kind, color: c ? c.id : null });
    if (!ensureAudio()) return;
    var t = ctx.currentTime + 0.01, f = c ? c.f : 440;
    if (kind === 'boing') {            // springy sweep with wobble
      tone('sine', t, 0.55, f * 0.55, f * 1.5, 0.5, { rate: 13, depth: f * 0.18 });
      tone('triangle', t, 0.4, f * 1.1, f * 2.2, 0.15);
    } else if (kind === 'squeak') {    // two rubber-duck chirps

    log({ t: 'again' });
    begin(false);
  }
  document.getElementById('again-yes').addEventListener('click', function () { playAgain(); });
  parentControl(againBtn, playAgain, againDialog.open);

  document.getElementById('doneBtn').addEventListener('click', guarded(function () {
    setScene('start'); show('start'); log({ t: 'done' });
    setTimeout(function () { try { document.getElementById('title').setAttribute('tabindex', '-1'); document.getElementById('title').focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 50);
  }));

  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stopClip(); try { if (synth) synth.cancel(); } catch (e) { /* ignore */ } }
    else if (ctx && ctx.state !== 'running') { try { ctx.resume(); } catch (e) { /* ignore */ } }
  });

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    // When a new version takes over, reload once — but only while the parent is on the start screen.
    var hadController = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (hadController && !reloaded && T.scene === 'start') { reloaded = true; location.reload(); }
    });
  }
})();
</script>
</body>
</html>
